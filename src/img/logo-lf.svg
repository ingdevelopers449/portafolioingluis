<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00f7ff" />
      <stop offset="100%" stopColor="#007cf0" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Subtle circular border -->
  <circle cx="50" cy="50" r="42" stroke="rgba(255,255,255,0.2)" strokeWidth="3" fill="none" />
  <circle cx="50" cy="50" r="42" stroke="url(#neon)" strokeWidth="4" strokeDasharray="60 300" strokeLinecap="round" fill="none" filter="url(#glow)" />
  
  <!-- Minimalist Interlocking L -->
  <path d="M 38 32 L 38 68 L 58 68" stroke="#ffffff" strokeWidth="8" strokeLinecap="round" strokeLinejoin="round" />
  
  <!-- Minimalist Interlocking F -->
  <path d="M 62 68 L 62 32 L 42 32 M 62 50 L 48 50" stroke="url(#neon)" strokeWidth="8" strokeLinecap="round" strokeLinejoin="round" filter="url(#glow)" />
</svg>
